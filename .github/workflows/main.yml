name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable verbose logging'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  id-token: write

jobs:
  # Job 1: Linting and Static Code Analysis
  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

  # Job 2: Multi-version Testing with Matrix Strategy
  test:
    name: Test on Node v${{ matrix.node-version }} (${{ matrix.os }})
    needs: lint
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
        os: [ubuntu-latest, windows-latest]
        exclude:
          - os: windows-latest
            node-version: 18
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit & Integration Tests
        run: npm run test:coverage

      - name: Upload Coverage Reports
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: error

  # Job 3: Protected Security Scanning
  security:
    name: Security Scan (SAST)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Security Scanner
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # Job 4: Build Release Artifacts
  build:
    name: Build Artifacts
    needs: [test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Production Dependencies
        run: npm ci --only=production

      - name: Compile Application
        run: npm run build

      - name: Upload Production Tarball
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 30
          if-no-files-found: error

  # Job 5: Conditional Deployment to Staging
  deploy-staging:
    name: Deploy to Staging Environment
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://example.com
    steps:
      - name: Download Production Build
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/

      - name: Authenticate to Cloud via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsWorkflowRole
          aws-region: us-east-1

      - name: Deploy to Cloud Provider
        run: |
          echo "Deploying application to Staging environment..."
          echo "Debug status: ${{ github.event.inputs.debug_mode }}"

  # Job 6: Gated Deployment to Production
  deploy-production:
    name: Deploy to Production Environment
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://example.com
    steps:
      - name: Download Production Build
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/

      - name: Authenticate to Cloud via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsProductionRole
          aws-region: us-east-1

      - name: Deploy to Cloud Provider
        run: |
          echo "Deploying application to Production environment..."
